<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Workshopr Design System Colors -->
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2744"/>
      <stop offset="100%" stop-color="#2E3D5C"/>
    </linearGradient>

    <!-- Grid pattern -->
    <pattern id="gridSmall" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#E5E7EB" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    <pattern id="gridLarge" width="192" height="192" patternUnits="userSpaceOnUse">
      <rect width="192" height="192" fill="url(#gridSmall)"/>
      <path d="M 192 0 L 0 0 0 192" fill="none" stroke="#D1D5DB" stroke-width="1" opacity="0.5"/>
    </pattern>

    <style>
      .label { font-family: Inter, Arial, sans-serif; font-size: 13px; fill: #78716C; }
      .label-sm { font-family: Inter, Arial, sans-serif; font-size: 11px; fill: #A8A29E; }
      .label-bold { font-family: Inter, Arial, sans-serif; font-size: 13px; fill: #1A2744; font-weight: 600; }
      .label-heading { font-family: Fraunces, Georgia, serif; font-size: 16px; fill: #2C2416; font-weight: 700; }
      .dim { font-family: Inter, Arial, sans-serif; font-size: 11px; fill: #E54D4D; font-weight: 500; }
      .dim-alt { font-family: Inter, Arial, sans-serif; font-size: 11px; fill: #3B7DD8; font-weight: 500; }
      .zone-label { font-family: Inter, Arial, sans-serif; font-size: 12px; fill: #5C5242; font-weight: 500; letter-spacing: 0.5px; }
    </style>
  </defs>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- BACKGROUND                                              -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <rect width="1920" height="1080" fill="url(#gridLarge)"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- SAFE MARGINS — 80px all sides (per presentations.php)   -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- Margin boundary (dashed) -->
  <rect x="80" y="80" width="1760" height="920" fill="none"
        stroke="#E54D4D" stroke-width="1" stroke-dasharray="8 4" opacity="0.5"/>

  <!-- Margin dimension labels -->
  <!-- Top margin -->
  <line x1="960" y1="0" x2="960" y2="80" stroke="#E54D4D" stroke-width="0.75" opacity="0.6"/>
  <text x="972" y="45" class="dim">80px</text>

  <!-- Left margin -->
  <line x1="0" y1="540" x2="80" y2="540" stroke="#E54D4D" stroke-width="0.75" opacity="0.6"/>
  <text x="18" y="530" class="dim">80px</text>

  <!-- Right margin -->
  <line x1="1840" y1="540" x2="1920" y2="540" stroke="#E54D4D" stroke-width="0.75" opacity="0.6"/>
  <text x="1854" y="530" class="dim">80px</text>

  <!-- Bottom margin -->
  <line x1="960" y1="1000" x2="960" y2="1080" stroke="#E54D4D" stroke-width="0.75" opacity="0.6"/>
  <text x="972" y="1050" class="dim">80px</text>

  <!-- Corner ticks -->
  <line x1="80" y1="72" x2="80" y2="88" stroke="#E54D4D" stroke-width="1" opacity="0.7"/>
  <line x1="72" y1="80" x2="88" y2="80" stroke="#E54D4D" stroke-width="1" opacity="0.7"/>
  <line x1="1840" y1="72" x2="1840" y2="88" stroke="#E54D4D" stroke-width="1" opacity="0.7"/>
  <line x1="1832" y1="80" x2="1848" y2="80" stroke="#E54D4D" stroke-width="1" opacity="0.7"/>
  <line x1="80" y1="992" x2="80" y2="1008" stroke="#E54D4D" stroke-width="1" opacity="0.7"/>
  <line x1="72" y1="1000" x2="88" y2="1000" stroke="#E54D4D" stroke-width="1" opacity="0.7"/>
  <line x1="1840" y1="992" x2="1840" y2="1008" stroke="#E54D4D" stroke-width="1" opacity="0.7"/>
  <line x1="1832" y1="1000" x2="1848" y2="1000" stroke="#E54D4D" stroke-width="1" opacity="0.7"/>


  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- ACCENT BAR — 0.1" = 19.2px at 192dpi (top of content)  -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="0" y="0" width="1920" height="19" fill="#3B7DD8" opacity="0.25"/>
  <rect x="0" y="0" width="1920" height="19" fill="none" stroke="#3B7DD8" stroke-width="1"/>
  <text x="100" y="14" class="dim-alt" font-size="10">ACCENT BAR — 19px (0.1")</text>


  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- CONTENT ZONES                                           -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- ZONE: Title (y: 48px to 182px — 0.25" to 0.95") -->
  <rect x="96" y="48" width="1728" height="134" rx="4"
        fill="#3B7DD8" opacity="0.06" stroke="#3B7DD8" stroke-width="1" stroke-dasharray="4 3" opacity="0.3"/>
  <text x="112" y="72" class="zone-label">TITLE ZONE</text>
  <text x="112" y="90" class="label-sm">Fraunces Bold 28pt (h2) / Ink #2C2416</text>
  <text x="112" y="106" class="label-sm">y: 0.25" (48px)  h: 0.7" (134px)</text>
  <!-- Dimension callout right side -->
  <text x="1756" y="72" class="dim-alt" text-anchor="end">0.25"</text>
  <line x1="1770" y1="48" x2="1770" y2="19" stroke="#3B7DD8" stroke-width="0.75" stroke-dasharray="3 2" opacity="0.5"/>
  <text x="1756" y="176" class="dim-alt" text-anchor="end">0.95"</text>


  <!-- ZONE: Body Content (y: 211px to 979px — 1.1" to 5.1") -->
  <rect x="96" y="211" width="1728" height="768" rx="4"
        fill="#22A756" opacity="0.04" stroke="#22A756" stroke-width="1" stroke-dasharray="4 3" opacity="0.25"/>
  <text x="112" y="240" class="zone-label">BODY CONTENT ZONE</text>
  <text x="112" y="258" class="label-sm">Inter Regular 15pt (body) / Ink Sec #5C5242</text>
  <text x="112" y="274" class="label-sm">y: 1.1" (211px)  h: 4.0" (768px)</text>
  <text x="1756" y="240" class="dim-alt" text-anchor="end">1.1"</text>

  <!-- Two-column split guide (center) -->
  <line x1="960" y1="211" x2="960" y2="979" stroke="#9CA3AF" stroke-width="0.75" stroke-dasharray="6 4" opacity="0.35"/>
  <text x="952" y="970" class="label-sm" text-anchor="end" opacity="0.6">LEFT COL</text>
  <text x="968" y="970" class="label-sm" opacity="0.6">RIGHT COL</text>

  <!-- Column width annotations -->
  <line x1="96" y1="950" x2="936" y2="950" stroke="#9CA3AF" stroke-width="0.5" opacity="0.3"/>
  <text x="516" y="944" class="label-sm" text-anchor="middle" opacity="0.5">4.375" (840px)</text>
  <line x1="984" y1="950" x2="1824" y2="950" stroke="#9CA3AF" stroke-width="0.5" opacity="0.3"/>
  <text x="1404" y="944" class="label-sm" text-anchor="middle" opacity="0.5">4.375" (840px)</text>


  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- FOOTER / SLIDE NUMBER ZONE                              -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="96" y="1008" width="1728" height="52" rx="4"
        fill="#F59E0B" opacity="0.06" stroke="#F59E0B" stroke-width="1" stroke-dasharray="4 3" opacity="0.25"/>
  <text x="112" y="1036" class="zone-label">FOOTER / SLIDE NUMBER</text>
  <text x="112" y="1052" class="label-sm">Inter 10pt / Ink Faint #A8A29E</text>

  <!-- Slide number position indicator -->
  <rect x="1728" y="1008" width="96" height="52" rx="4"
        fill="#A8A29E" opacity="0.1" stroke="#A8A29E" stroke-width="1" stroke-dasharray="3 2" opacity="0.4"/>
  <text x="1776" y="1040" class="label-sm" text-anchor="middle" fill="#78716C">##</text>


  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- OUTER DIMENSION RULERS                                  -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- Canvas width ruler (bottom) -->
  <line x1="0" y1="1076" x2="1920" y2="1076" stroke="#1A2744" stroke-width="0.5" opacity="0.2"/>
  <line x1="0" y1="1072" x2="0" y2="1080" stroke="#1A2744" stroke-width="0.75" opacity="0.3"/>
  <line x1="1920" y1="1072" x2="1920" y2="1080" stroke="#1A2744" stroke-width="0.75" opacity="0.3"/>

  <!-- Canvas height ruler (right) -->
  <line x1="1916" y1="0" x2="1916" y2="1080" stroke="#1A2744" stroke-width="0.5" opacity="0.2"/>
  <line x1="1912" y1="0" x2="1920" y2="0" stroke="#1A2744" stroke-width="0.75" opacity="0.3"/>
  <line x1="1912" y1="1080" x2="1920" y2="1080" stroke="#1A2744" stroke-width="0.75" opacity="0.3"/>


  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- EXERCISE SLIDE: GREEN HEADER ZONE                       -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="96" y="0" width="360" height="192" rx="4"
        fill="#22A756" opacity="0.08" stroke="#22A756" stroke-width="1" stroke-dasharray="4 3" opacity="0.3"/>
  <text x="112" y="130" class="label-sm" fill="#22A756" font-weight="500">EXERCISE</text>
  <text x="112" y="146" class="label-sm" fill="#22A756">HEADER</text>
  <text x="112" y="162" class="label-sm" fill="#22A756">1.0" (192px)</text>


  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- SECTION SLIDE: CENTERED TITLE POSITION                  -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <line x1="960" y1="346" x2="960" y2="346" stroke="none"/>
  <!-- Vertical center guide -->
  <line x1="480" y1="540" x2="1440" y2="540" stroke="#7C4DFF" stroke-width="0.75" stroke-dasharray="6 4" opacity="0.2"/>
  <text x="1448" y="536" class="label-sm" fill="#7C4DFF" opacity="0.5">V-CENTER (540px)</text>

  <!-- Horizontal center guide -->
  <line x1="960" y1="280" x2="960" y2="800" stroke="#7C4DFF" stroke-width="0.75" stroke-dasharray="6 4" opacity="0.2"/>
  <text x="968" y="296" class="label-sm" fill="#7C4DFF" opacity="0.5">H-CENTER</text>


  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- LEGEND                                                  -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="480" y="400" width="960" height="280" rx="12"
        fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="none" opacity="0.97"/>

  <!-- Legend header -->
  <text x="520" y="436" class="label-heading">Workshopr Presentation Grid</text>
  <text x="520" y="456" class="label-sm">16:9 (1920 x 1080px) — 10" x 5.625" — Safe margins 80px</text>

  <!-- Divider -->
  <line x1="520" y1="470" x2="1400" y2="470" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Row 1: Colors -->
  <text x="520" y="500" class="label-bold">Color Zones</text>

  <rect x="520" y="510" width="14" height="14" rx="2" fill="#3B7DD8" opacity="0.3" stroke="#3B7DD8" stroke-width="0.75"/>
  <text x="540" y="522" class="label-sm">Title Zone (Fraunces h2, #2C2416)</text>

  <rect x="780" y="510" width="14" height="14" rx="2" fill="#22A756" opacity="0.15" stroke="#22A756" stroke-width="0.75"/>
  <text x="800" y="522" class="label-sm">Body Zone (Inter body, #5C5242)</text>

  <rect x="1060" y="510" width="14" height="14" rx="2" fill="#F59E0B" opacity="0.15" stroke="#F59E0B" stroke-width="0.75"/>
  <text x="1080" y="522" class="label-sm">Footer / Slide # (#A8A29E)</text>

  <!-- Row 2: Layout positions -->
  <text x="520" y="556" class="label-bold">Key Positions (inches)</text>

  <text x="520" y="578" class="label-sm">Accent bar: y=0, h=0.1"</text>
  <text x="520" y="596" class="label-sm">Title: x=0.5", y=0.25", w=9"</text>
  <text x="520" y="614" class="label-sm">Body: x=0.5", y=1.1", w=9", h=4"</text>

  <text x="800" y="578" class="label-sm">Footer: y=4.8"</text>
  <text x="800" y="596" class="label-sm">Slide #: x=9", y=5.25"</text>
  <text x="800" y="614" class="label-sm">Exercise hdr: h=1.0"</text>

  <!-- Row 3: Typography -->
  <text x="1060" y="556" class="label-bold">Typography</text>
  <text x="1060" y="578" class="label-sm">Headings: Fraunces 700</text>
  <text x="1060" y="596" class="label-sm">Body: Inter 400</text>
  <text x="1060" y="614" class="label-sm">Fallback: Georgia / Arial</text>

  <!-- Row 4: Module color -->
  <line x1="520" y1="630" x2="1400" y2="630" stroke="#E5E7EB" stroke-width="0.75"/>
  <text x="520" y="654" class="label-bold">Module Colors</text>

  <rect x="520" y="662" width="14" height="14" rx="2" fill="#3B7DD8"/>
  <text x="540" y="674" class="label-sm">M1 #3B7DD8</text>

  <rect x="632" y="662" width="14" height="14" rx="2" fill="#7C4DFF"/>
  <text x="652" y="674" class="label-sm">M2 #7C4DFF</text>

  <rect x="744" y="662" width="14" height="14" rx="2" fill="#22A756"/>
  <text x="764" y="674" class="label-sm">M3 #22A756</text>

  <rect x="856" y="662" width="14" height="14" rx="2" fill="#E54D4D"/>
  <text x="876" y="674" class="label-sm">M4 #E54D4D</text>

  <rect x="968" y="662" width="14" height="14" rx="2" fill="#F97316"/>
  <text x="988" y="674" class="label-sm">M5 #F97316</text>

  <rect x="1080" y="662" width="14" height="14" rx="2" fill="#2563EB"/>
  <text x="1100" y="674" class="label-sm">M6 #2563EB</text>

  <rect x="1192" y="662" width="14" height="14" rx="2" fill="#C73E3E"/>
  <text x="1212" y="674" class="label-sm">M7 #C73E3E</text>

  <rect x="1304" y="662" width="14" height="14" rx="2" fill="#1A2744"/>
  <text x="1324" y="674" class="label-sm">M8 #1A2744</text>


  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- BRANDING WATERMARK                                      -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <text x="1840" y="1068" font-family="Inter, Arial, sans-serif" font-size="10" fill="#A8A29E" text-anchor="end" opacity="0.6">workshopr.io/design-system</text>

</svg>